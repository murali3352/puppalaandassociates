<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found — Puppala and Associates</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1628'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23c9a84c' font-family='serif' font-weight='700' font-size='16'%3EPA%3C/text%3E%3C/svg%3E">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 40%, var(--primary-medium) 100%);
      text-align: center;
      padding: var(--space-xl);
      position: relative;
      overflow: hidden;
      perspective: 1000px;
    }
    .error-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .error-content {
      max-width: 560px;
      position: relative;
      z-index: 2;
      transform-style: preserve-3d;
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-dark));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: var(--space-md);
      transform: translateZ(60px);
    }
    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      color: var(--white);
      margin-bottom: var(--space-md);
      transform: translateZ(30px);
    }
    .error-text {
      color: rgba(255,255,255,.55);
      font-size: 1rem;
      margin-bottom: var(--space-xl);
      line-height: 1.8;
    }
    .error-links {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-2xl);
    }
    .error-quick {
      display: flex;
      gap: var(--space-sm);
      justify-content: center;
      flex-wrap: wrap;
      padding-top: var(--space-lg);
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .error-quick a {
      font-size: .85rem;
      font-weight: 600;
      color: rgba(255,255,255,.6);
      border: 1px solid rgba(255,255,255,.14);
      padding: 7px 16px;
      border-radius: var(--radius-full);
      transition: all var(--transition-fast);
    }
    .error-quick a:hover {
      color: var(--primary);
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1 class="error-title">This page could not be found</h1>
      <p class="error-text">
        The page you are looking for does not exist or has moved. Everything on our site — services,
        fee enquiries and contact details — is reachable from the homepage.
      </p>
      <div class="error-links">
        <a href="./" class="btn btn-primary">
          Go to Homepage
          <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a href="tel:+917075644785" class="btn btn-outline">Call +91 70756 44785</a>
      </div>
      <div class="error-quick">
        <a href="./#services">Services</a>
        <a href="./#about">About Us</a>
        <a href="./#contact">Contact</a>
        <a href="./#learn-income-tax">Income Tax</a>
        <a href="./#learn-gst">GST</a>
      </div>
    </div>
  </div>
</body>
</html>
