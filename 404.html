<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Puppala and Associates</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 40%, var(--primary-medium) 100%);
      text-align: center;
      padding: var(--space-xl);
    }
    .error-content {
      max-width: 500px;
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: 8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: var(--space-md);
    }
    .error-title {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: var(--white);
      margin-bottom: var(--space-md);
    }
    .error-text {
      color: rgba(255,255,255,.5);
      font-size: 1rem;
      margin-bottom: var(--space-2xl);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-text">
        The page you're looking for doesn't exist or has been moved. Let us help you find your way back.
      </p>
      <a href="index.html" class="btn btn-primary">
        Go to Homepage
        <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</body>
</html>
