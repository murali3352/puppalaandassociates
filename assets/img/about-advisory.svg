<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="aboutTitle aboutDesc">
  <title id="aboutTitle">Puppala and Associates — financial advisory workspace</title>
  <desc id="aboutDesc">Illustration of an accounting dashboard with growth chart, audit checklist, GST donut chart and verified compliance badge.</desc>

  <defs>
    <linearGradient id="bgNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#132240"/>
      <stop offset="100%" stop-color="#1a3058"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfc274"/>
      <stop offset="100%" stop-color="#a8882e"/>
    </linearGradient>
    <linearGradient id="cardWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef1f7"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a8882e"/>
      <stop offset="100%" stop-color="#dfc274"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9a84c" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04091a" flood-opacity=".45"/>
    </filter>
    <filter id="softSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#04091a" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="800" height="600" fill="url(#bgNavy)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="655" cy="120" r="230" fill="url(#glow)"/>
  <circle cx="120" cy="500" r="180" fill="url(#glow)" opacity=".7"/>

  <!-- Decorative rings -->
  <circle cx="690" cy="90" r="150" fill="none" stroke="#c9a84c" stroke-opacity=".12"/>
  <circle cx="690" cy="90" r="104" fill="none" stroke="#c9a84c" stroke-opacity=".08"/>

  <!-- ===== Main dashboard card ===== -->
  <g filter="url(#soft)">
    <rect x="132" y="96" width="466" height="308" rx="20" fill="url(#cardWhite)"/>
  </g>
  <rect x="132" y="96" width="466" height="52" rx="20" fill="#0a1628"/>
  <rect x="132" y="130" width="466" height="18" fill="#0a1628"/>
  <circle cx="162" cy="122" r="6" fill="#c9a84c"/>
  <circle cx="182" cy="122" r="6" fill="#ffffff" fill-opacity=".22"/>
  <circle cx="202" cy="122" r="6" fill="#ffffff" fill-opacity=".22"/>
  <rect x="228" y="115" width="150" height="8" rx="4" fill="#ffffff" fill-opacity=".28"/>
  <rect x="500" y="112" width="74" height="22" rx="11" fill="#c9a84c" fill-opacity=".2"/>
  <text x="537" y="128" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#dfc274">FY 25-26</text>

  <!-- Card heading -->
  <text x="164" y="192" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#0a1628">Revenue &amp; Tax Position</text>
  <rect x="164" y="204" width="120" height="6" rx="3" fill="#c9a84c" fill-opacity=".45"/>

  <!-- Growth bars -->
  <g>
    <rect x="168" y="330" width="34" height="42" rx="7" fill="url(#barGrad)" opacity=".55"/>
    <rect x="216" y="308" width="34" height="64" rx="7" fill="url(#barGrad)" opacity=".68"/>
    <rect x="264" y="278" width="34" height="94" rx="7" fill="url(#barGrad)" opacity=".8"/>
    <rect x="312" y="252" width="34" height="120" rx="7" fill="url(#barGrad)" opacity=".9"/>
    <rect x="360" y="228" width="34" height="144" rx="7" fill="url(#barGrad)"/>
    <rect x="164" y="378" width="230" height="3" rx="1.5" fill="#0a1628" fill-opacity=".12"/>
  </g>

  <!-- Trend line + node dots -->
  <polyline points="185,318 233,296 281,266 329,240 377,214" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#0d9488" stroke-width="3">
    <circle cx="185" cy="318" r="5"/><circle cx="233" cy="296" r="5"/><circle cx="281" cy="266" r="5"/><circle cx="329" cy="240" r="5"/><circle cx="377" cy="214" r="5.5"/>
  </g>

  <!-- Audit checklist panel inside card -->
  <g>
    <rect x="424" y="172" width="150" height="208" rx="14" fill="#0a1628" fill-opacity=".05"/>
    <text x="442" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">AUDIT CHECKLIST</text>
    <g>
      <circle cx="450" cy="224" r="9" fill="#22c55e" fill-opacity=".16"/>
      <path d="M446 224l3 3 5-6" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="468" y="220" width="88" height="7" rx="3.5" fill="#0a1628" fill-opacity=".24"/>
    </g>
    <g>
      <circle cx="450" cy="256" r="9" fill="#22c55e" fill-opacity=".16"/>
      <path d="M446 256l3 3 5-6" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="468" y="252" width="72" height="7" rx="3.5" fill="#0a1628" fill-opacity=".24"/>
    </g>
    <g>
      <circle cx="450" cy="288" r="9" fill="#22c55e" fill-opacity=".16"/>
      <path d="M446 288l3 3 5-6" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="468" y="284" width="84" height="7" rx="3.5" fill="#0a1628" fill-opacity=".24"/>
    </g>
    <g>
      <circle cx="450" cy="320" r="9" fill="#c9a84c" fill-opacity=".2"/>
      <circle cx="450" cy="320" r="3" fill="#a8882e"/>
      <rect x="468" y="316" width="60" height="7" rx="3.5" fill="#0a1628" fill-opacity=".16"/>
    </g>
    <g>
      <circle cx="450" cy="352" r="9" fill="#c9a84c" fill-opacity=".2"/>
      <circle cx="450" cy="352" r="3" fill="#a8882e"/>
      <rect x="468" y="348" width="76" height="7" rx="3.5" fill="#0a1628" fill-opacity=".16"/>
    </g>
  </g>

  <!-- ===== GST donut card (front-left) ===== -->
  <g filter="url(#softSm)">
    <rect x="72" y="352" width="248" height="164" rx="18" fill="url(#cardWhite)"/>
  </g>
  <text x="98" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">GST FILINGS · ON TIME</text>
  <g transform="translate(146 448)">
    <circle r="44" fill="none" stroke="#e2e8f0" stroke-width="16"/>
    <circle r="44" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"
            stroke-dasharray="276.5 276.5" transform="rotate(-90)"/>
    <text y="7" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#0a1628">100%</text>
  </g>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#475569">
    <circle cx="216" cy="428" r="5" fill="#c9a84c"/>
    <text x="230" y="432">Filed on time</text>
    <circle cx="216" cy="456" r="5" fill="#0d9488"/>
    <text x="230" y="460">Zero notices</text>
    <circle cx="216" cy="484" r="5" fill="#22c55e"/>
    <text x="230" y="488">Fully reconciled</text>
  </g>

  <!-- ===== Verified badge (front-right) ===== -->
  <g filter="url(#softSm)" transform="translate(560 380)">
    <rect x="0" y="0" width="176" height="118" rx="18" fill="#0a1628"/>
    <rect x="0" y="0" width="176" height="118" rx="18" fill="none" stroke="#c9a84c" stroke-opacity=".35"/>
    <g transform="translate(26 26)">
      <path d="M22 0l20 7v14c0 13-8.5 22.5-20 27C10.5 43.5 2 34 2 21V7L22 0z" fill="url(#goldGrad)"/>
      <path d="M14 21l6 6 11-12" fill="none" stroke="#0a1628" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="88" y="96" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#dfc274">100% COMPLIANT</text>
  </g>

  <!-- ===== Rupee coin stack ===== -->
  <g transform="translate(648 250)">
    <ellipse cx="0" cy="52" rx="46" ry="15" fill="#04091a" fill-opacity=".35"/>
    <g>
      <ellipse cx="0" cy="44" rx="40" ry="13" fill="#a8882e"/>
      <ellipse cx="0" cy="40" rx="40" ry="13" fill="url(#goldGrad)"/>
      <ellipse cx="0" cy="26" rx="40" ry="13" fill="#a8882e"/>
      <ellipse cx="0" cy="22" rx="40" ry="13" fill="url(#goldGrad)"/>
      <ellipse cx="0" cy="8" rx="40" ry="13" fill="#a8882e"/>
      <ellipse cx="0" cy="4" rx="40" ry="13" fill="url(#goldGrad)"/>
      <text y="10" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0a1628">₹</text>
    </g>
  </g>

  <!-- Floating sparkles -->
  <g fill="#c9a84c">
    <path d="M96 132l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity=".55"/>
    <path d="M736 196l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".4"/>
    <circle cx="60" cy="252" r="4" opacity=".35"/>
    <circle cx="770" cy="330" r="3" opacity=".3"/>
  </g>

  <!-- Signature strip -->
  <g transform="translate(72 548)">
    <rect x="0" y="0" width="4" height="26" rx="2" fill="#c9a84c"/>
    <text x="18" y="12" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#ffffff">Puppala &amp; Associates</text>
    <text x="18" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="11" letter-spacing="2" fill="#c9a84c">CHARTERED ACCOUNTANTS · AMALAPURAM</text>
  </g>
</svg>
